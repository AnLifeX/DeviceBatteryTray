# 推送 vX.Y.Z 标签时编译，并创建草稿 Release（附带 DeviceBatteryTray.exe）。
#   git tag v0.2.0
#   git push origin v0.2.0
# 草稿确认无误后在 GitHub 上点「Publish release」，程序的自动更新只认已发布的 Release。
# 不上传构建产物、不使用构建缓存。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "标签格式应为 vX.Y.Z：$env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 编译（单文件，依赖 .NET 8 桌面运行时）
        run: >
          dotnet publish src/DeviceBatteryTray -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:Version=${{ steps.ver.outputs.version }} -o publish

      - name: 创建草稿 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME publish/DeviceBatteryTray.exe `
            --draft --title "设备电量 $env:GITHUB_REF_NAME" --generate-notes
