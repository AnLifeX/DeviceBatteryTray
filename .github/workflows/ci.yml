# 推送 vX.Y.Z 标签时编译、打包（build/package.ps1），并发布 Release：
#   DeviceBatteryTray-Setup.exe     安装包（安装 / 卸载 / 自动更新）
#   DeviceBatteryTray-Portable.zip  便携版
#
#   git tag v0.2.0
#   git push origin v0.2.0
#
# 发布后，已安装的程序会通过自动更新收到新版本。
# 不上传构建产物、不使用构建缓存。
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 版本号
        id: ver
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.Substring(1)
          if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "标签格式应为 vX.Y.Z：$env:GITHUB_REF_NAME" }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: 打包
        shell: pwsh
        run: ./build/package.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: 发布 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create $env:GITHUB_REF_NAME
          Releases/DeviceBatteryTray-Setup.exe Releases/DeviceBatteryTray-Portable.zip
          --title "设备电量 $env:GITHUB_REF_NAME" --generate-notes
